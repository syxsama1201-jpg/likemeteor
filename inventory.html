<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理 - 控制面板</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- ===== 登录遮罩层 ===== -->
    <div id="loginOverlay" class="login-overlay hidden">
        <div class="login-card">
            <div class="login-title">库存管理</div>
            <div class="login-subtitle">请输入账号密码登录</div>
            <input type="text" id="loginUser" class="login-input" placeholder="用户名" autocomplete="username">
            <input type="password" id="loginPass" class="login-input" placeholder="密码" autocomplete="current-password">
            <button id="loginBtn" class="login-btn" onclick="doLogin()">登 录</button>
            <div id="loginError" class="login-error"></div>
            <div class="login-footer">Acmezone 库存数据看板</div>
        </div>
    </div>

    <!-- ===== 侧边栏 ===== -->
    <div class="sidebar">
        <div class="sidebar-logo"></div>
        <a class="nav-item" href="index.html">
            <div class="nav-icon-placeholder"></div>首页
        </a>
        <a class="nav-item" href="index.html">
            <div class="nav-icon-placeholder"></div>销售
        </a>
        <a class="nav-item active" href="inventory.html">
            <div class="nav-icon-placeholder" style="background-color:#fff;"></div>库存
        </a>
        <a class="nav-item" href="#">
            <div class="nav-icon-placeholder"></div>FBA
        </a>
        <a class="nav-item" href="#">
            <div class="nav-icon-placeholder"></div>客服
        </a>
        <a class="nav-item" href="#">
            <div class="nav-icon-placeholder"></div>跟卖
        </a>
        <a class="nav-item erp" href="#">
            <div class="nav-icon-placeholder" style="background-color:#fff;"></div>ERP
        </a>
    </div>

    <!-- ===== 主内容区 ===== -->
    <div class="main-container">
        <header class="top-header">
            <div class="header-tabs">
                <div class="tab active">库存管理<div class="close-icon-placeholder"></div></div>
            </div>
            <div class="header-right">
                <div class="user-avatar-placeholder"></div>
            </div>
        </header>

        <main class="content-scrollable">
            <div class="page-title-row">
                <div class="title-group">
                    <h2>库存管理<div style="width:16px;height:16px;background:#165dff;border-radius: 2px;display: inline-block;vertical-align: middle;"></div></h2>
                    <div class="update-time" style="margin-left: 60px;">更新时间
                        <span id="target-time"></span>
                    </div>
                </div>
            </div>

            <div class="filter-row">
                <div class="select-placeholder">全部店铺 <div class="arrow-placeholder"></div></div>
                <div class="select-placeholder">全部仓库 <div class="arrow-placeholder"></div></div>
            </div>

            <!-- ===== 库存总览卡片 ===== -->
            <div class="stats-grid" id="inventory-cards">
                <div class="stat-card">
                    <div class="stat-header">SKU数量</div>
                    <div class="stat-value" id="card-sku-count">--</div>
                    <div class="stat-footer" id="card-sku-footer"><span>活跃SKU</span><span class="trend-none">--</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">可售库存</div>
                    <div class="stat-value" id="card-sellable">--</div>
                    <div class="stat-footer" id="card-sellable-footer"><span>总量</span><span>--</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">不可售库存</div>
                    <div class="stat-value" id="card-unsellable">--</div>
                    <div class="stat-footer" id="card-unsellable-footer"><span>总量</span><span>--</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">在途库存</div>
                    <div class="stat-value" id="card-inbound">--</div>
                    <div class="stat-footer" id="card-inbound-footer"><span>待入库</span><span>--</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">库存总额</div>
                    <div class="stat-value" id="card-total-value">--</div>
                    <div class="stat-footer" id="card-value-footer"><span>估算值</span><span class="trend-none">--</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">库存预警</div>
                    <div class="stat-value" id="card-alert-count">--</div>
                    <div class="stat-footer" id="card-alert-footer"><span>低库存商品</span><span class="trend-none">--</span></div>
                </div>
            </div>

            <div class="table-toolbar">
                <div class="toolbar-left">
                    <div class="search-group">
                        <div style="padding: 0 8px; border-right:1px solid #e5e6eb; line-height:22px; width:80px; box-sizing: border-box; text-align: center; color: #4e5969;">搜索</div>
                        <input type="text" id="searchInput" placeholder="商品名称 / SKU / ASIN" oninput="handleSearch(event)" style="padding: 0 8px; border:none; line-height:22px; width:200px; box-sizing: border-box; font-size:10px; color: #1d2129;">
                    </div>
                </div>
                <div class="toolbar-right" style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4e5969;">
                    <span id="toolbar-total-count">共 0 条</span>
                </div>
            </div>

            <!-- ===== 库存数据表格 ===== -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-core1-id">商品名称</th>
                            <th>产品图</th>
                            <th class="col-core2-id">SKU</th>
                            <th class="col-core2-id">ASIN</th>
                            <th class="sortable" onclick="handleSort('可售库存')">可售库存 <span id="sort-icon-可售库存" class="sort-icon sort-none"></span></th>
                            <th class="sortable" onclick="handleSort('不可售库存')">不可售库存 <span id="sort-icon-不可售库存" class="sort-icon sort-none"></span></th>
                            <th class="sortable" onclick="handleSort('在途库存')">在途库存 <span id="sort-icon-在途库存" class="sort-icon sort-none"></span></th>
                            <th class="sortable" onclick="handleSort('预留库存')">预留库存 <span id="sort-icon-预留库存" class="sort-icon sort-none"></span></th>
                            <th>库龄(天)</th>
                            <th class="sortable" onclick="handleSort('周转天数')">周转天数 <span id="sort-icon-周转天数" class="sort-icon sort-none"></span></th>
                            <th>最近入库日期</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ===== 脚本加载 ===== -->
    <script src="js/common.js"></script>
    <script src="js/inventory.js"></script>
    <script>
        window.addEventListener('load', startTimeDisplay);
    </script>
</body>
</html>
